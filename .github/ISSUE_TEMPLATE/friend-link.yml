name: 友情链接申请
description: 申请加入小呆呆的博客友链
title: "[友链申请] "
labels:
  - friend-link
body:
  - type: markdown
    attributes:
      value: |
        感谢申请友链。提交前请先在你的网站友链页添加本站链接�?
        - 网站名称：小呆呆的博�?        - 网站地址：https://hengjiasteven-dotcom.github.io/my-website/
        - 网站描述：分享技术，记录生活，顺手做点小工具�?        - 网站头像：https://hengjiasteven-dotcom.github.io/my-website/img/avatar.png
  - type: input
    id: name
    attributes:
      label: 网站名称
      placeholder: 例如：雨雪冰�?    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: 网站链接
      placeholder: https://example.com/
    validations:
      required: true
  - type: input
    id: avatar
    attributes:
      label: 网站头像 / LOGO
      placeholder: https://example.com/avatar.png
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 网站描述
      placeholder: 一句话介绍你的网站
    validations:
      required: true
  - type: input
    id: email
    attributes:
      label: 联系邮箱
      placeholder: your@email.com
    validations:
      required: true
  - type: input
    id: rss
    attributes:
      label: RSS 订阅
      placeholder: https://example.com/rss.xml，可�?    validations:
      required: false
  - type: input
    id: backlink
    attributes:
      label: 反链地址
      description: 请填写已添加本站链接的页面地址�?      placeholder: https://example.com/links/
    validations:
      required: false

